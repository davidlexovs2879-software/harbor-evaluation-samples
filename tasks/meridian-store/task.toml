schema_version = "1.3"

[task]
name = "samples/meridian-store"
description = "Build a recoverable serializable key-value engine with authenticated snapshots."

[metadata]
difficulty = "hard"
category = "software-engineering"
tags = ["storage", "transactions", "crash-recovery", "merkle-tree"]

[agent]
timeout_sec = 72000
user = "agent"

[verifier]
timeout_sec = 600
user = "root"

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "no-network"
