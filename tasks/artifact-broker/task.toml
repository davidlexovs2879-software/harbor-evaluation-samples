schema_version = "1.3"

[task]
name = "samples/artifact-broker"
description = "Repair a delegated artifact broker while preserving legitimate tenant workflows."

[metadata]
difficulty = "hard"
category = "cybersecurity"
tags = ["iam", "confused-deputy", "archive-security", "audit", "capabilities"]

[agent]
timeout_sec = 72000
user = "agent"

[verifier]
timeout_sec = 600
user = "root"

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "no-network"
